name: Probe
on:
  push:
    paths: ['scripts/probe.py']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe.py
      - run: |
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add probe.json; git commit -qm probe; for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
