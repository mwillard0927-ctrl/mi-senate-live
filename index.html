<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Michigan Senate Live</title>
<link rel="manifest" href="manifest.json?v=2">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#fff;--tx:#111;--mut:#5b6472;--soft:#f4f5f7;--track:#eceef1;--d:#1f5fd6;--r:#c62828;--live:#d22}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--tx:#eef0f3;--mut:#9aa3b0;--soft:#181b21;--track:#262a31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif;text-align:center}
.w{max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.top{padding:28px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:6px}
.live{border:2px solid var(--live);color:var(--live);border-radius:99px;padding:2px 12px;font-size:12px;font-weight:700}
h1{margin:0;font-size:24px}
.mut{color:var(--mut);font-size:13px}
.h2h{width:100%;display:grid;grid-template-columns:1fr 1fr}
.side{color:#fff;padding:36px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:background .3s}
.side .p{font-size:13px;font-weight:500;opacity:.9;letter-spacing:.5px}
.side .n{font-size:20px;font-weight:700}
.side .pct{font-size:50px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.side .v{font-size:13px}
.tag{margin-top:6px;background:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.mid{width:100%;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.track{width:85%;height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--tx);border-radius:99px;transition:width .6s}
.news{width:calc(100% - 40px);background:var(--soft);border-radius:16px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:24px}
.lbl{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:1px}
.item{padding:12px 0;border-top:1px solid var(--track);width:100%}
.item:first-of-type{border-top:0}
.item a{color:var(--tx);text-decoration:none;font-weight:500;font-size:15px}
.new{color:var(--live);font-size:11px;font-weight:700;margin-right:6px}
.flash{animation:fl 1.5s}@keyframes fl{0%{filter:brightness(1.35)}100%{filter:none}}
</style></head><body>
<div class="w">
 <div class="top">
  <span class="live">● LIVE</span>
  <h1>Michigan US Senate</h1>
  <div class="mut" id="sub">Loading results…</div>
 </div>
 <div class="h2h" id="h2h">
  <div class="side" id="s0" style="background:var(--d)"><div class="p">DEMOCRAT</div><div class="n">—</div><div class="pct">—</div><div class="v"></div></div>
  <div class="side" id="s1" style="background:var(--r)"><div class="p">REPUBLICAN</div><div class="n">—</div><div class="pct">—</div><div class="v"></div></div>
 </div>
 <div class="mid">
  <div style="font-size:15px;font-weight:700" id="margin"></div>
  <div class="track"><i id="pinbar" style="width:0"></i></div>
  <div class="mut" id="cty"></div>
  <div class="mut" id="others"></div>
 </div>
 <div class="mut" style="margin-bottom:24px;font-size:11px">Results via NBC News · updates automatically</div>
</div>
<script>
const fmt=n=>Number(n||0).toLocaleString();
function ago(d){const m=Math.max(0,Math.round((Date.now()-new Date(d))/60000));return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' hr ago'}
let lastKey='',seen=new Set(),first=true;
async function getJSON(f){return (await fetch(f+'?t='+Date.now(),{cache:'no-store'})).json()}
function fill(el,c,lead,color){
 el.querySelector('.p').textContent=c.party==='dem'?'DEMOCRAT':c.party==='gop'?'REPUBLICAN':(c.party||'').toUpperCase();
 el.querySelector('.n').textContent=c.last;
 el.querySelector('.pct').textContent=c.pct+'%';
 el.querySelector('.v').textContent=fmt(c.votes);
 const old=el.querySelector('.tag');if(old)old.remove();
 const t=c.winner?'WINNER':(lead&&c.votes?'LEADING':'');
 if(t){const s=document.createElement('div');s.className='tag';s.textContent=t;s.style.color=color;el.appendChild(s)}
}
async function loadResults(){
 try{
  const j=await getJSON('results.json');const c=j.candidates||[];if(c.length<2)return;
  const d=c.find(x=>x.party==='dem')||c[0], r=c.find(x=>x.party==='gop')||c[1];
  const win=c.find(x=>x.winner);
  fill(document.getElementById('s0'),d,d.votes>=r.votes,'var(--d)');
  fill(document.getElementById('s1'),r,r.votes>d.votes,'var(--r)');
  const lead=d.votes>=r.votes?d:r;
  document.getElementById('sub').textContent=(j.percentIn||'0%')+' in · '+(win?win.last+' wins (projected)':'not called')+(j.sourceUpdated?' · '+j.sourceUpdated:'');
  document.getElementById('margin').textContent=d.votes||r.votes?'Margin: '+fmt(Math.abs(d.votes-r.votes))+' votes ('+lead.last+')':'No votes reported yet';
  document.getElementById('pinbar').style.width=parseFloat(j.percentIn||0)+'%';
  if(j.counties)document.getElementById('cty').textContent=j.countiesReporting+' of '+j.counties+' counties reporting';
  const rest=c.filter(x=>x!==d&&x!==r);
  if(rest.length)document.getElementById('others').textContent='Others: '+rest.map(x=>x.last+' '+x.pct+'%').join(' · ');
  const key=c.map(x=>x.votes).join();if(lastKey&&key!==lastKey){const h=document.getElementById('h2h');h.classList.remove('flash');void h.offsetWidth;h.classList.add('flash')}lastKey=key;
 }catch(e){document.getElementById('sub').textContent='Couldn\'t load results — retrying'}
}
function tick(){loadResults()}
tick();setInterval(tick,60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
</script>
</body></html>
