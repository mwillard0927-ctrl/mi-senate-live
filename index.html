<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Michigan Senate Live</title>
<link rel="manifest" href="manifest.json?v=2">
<meta name="theme-color" content="#14171c">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mut:#5b6472;--line:#e3e6ea;--d:#1f5fd6;--r:#cf2a2a;--o:#8a8f98;--live:#d22;--track:#eceef1}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#e8eaee;--mut:#9aa3b0;--line:#272b33;--d:#5b8cff;--r:#ff5a5a;--o:#777e8a;--track:#262a31}}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;margin:0}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:6px 0 2px}
.live{display:inline-block;background:var(--live);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.status{font-size:17px;font-weight:700;margin-bottom:4px}
.rep{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
.track{flex:1;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;background:var(--tx);border-radius:99px;transition:width .6s}
.cand{padding:10px 0;border-top:1px solid var(--line)}
.cand:first-of-type{border-top:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm{font-weight:700;font-size:16px}
.pct{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--track);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s}
.won{background:#1a8f3c;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.others{margin-top:8px}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item a{color:var(--tx);text-decoration:none;font-weight:600}
.new{color:var(--live);font-size:11px;font-weight:700;margin-right:6px}
.flash{animation:fl 1.5s}@keyframes fl{0%{background:rgba(255,200,0,.35)}100%{background:transparent}}
</style></head><body>
<div class="w">
<span class="live">● LIVE</span>
<h1>US Senate · Michigan</h1>
<div class="mut" id="upd">Loading results…</div>

<div class="card" id="res">
 <div class="status" id="status">Loading…</div>
 <div class="rep"><span class="mut" id="pin">—</span><div class="track"><i id="pinbar" style="width:0"></i></div></div>
 <div id="cands"></div>
 <div class="mut others" id="others"></div>
 <div class="mut" id="cty" style="margin-top:8px"></div>
</div>

<div class="card"><b>Latest news</b> <span class="mut">· auto-updates</span>
<div id="feed" class="mut" style="margin-top:8px">Loading…</div></div>

<div class="mut" style="text-align:center;margin:8px 0 24px">Results data via NBC News. Page refreshes itself every minute; new data every ~5 min.</div>
</div>
<script>
const color=p=>p==='dem'?'var(--d)':p==='gop'?'var(--r)':'var(--o)';
const fmt=n=>Number(n||0).toLocaleString();
function ago(d){const m=Math.max(0,Math.round((Date.now()-new Date(d))/60000));return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' hr ago'}
let lastKey='',seen=new Set(),first=true;
async function getJSON(f){return (await fetch(f+'?t='+Date.now(),{cache:'no-store'})).json()}
async function loadResults(){
 try{
  const j=await getJSON('results.json'); const c=j.candidates||[];
  if(!c.length){document.getElementById('status').textContent='Waiting for first results…';return}
  const [a,b]=c; const win=c.find(x=>x.winner);
  document.getElementById('status').textContent= win? win.last+' wins (projected)' : (a.votes===0?'No votes reported yet':a.last+' leads · not called yet');
  document.getElementById('pin').textContent=(j.percentIn||'0%')+' of expected vote in';
  document.getElementById('pinbar').style.width=parseFloat(j.percentIn||0)+'%';
  const box=document.getElementById('cands');box.innerHTML='';
  c.slice(0,2).forEach(x=>{const e=document.createElement('div');e.className='cand';
   e.innerHTML='<div class="row"><div><span class="nm"></span><span class="pt mut"></span></div><div class="pct"></div></div><div class="row mut"><span class="v"></span></div><div class="bar"><i></i></div>';
   e.querySelector('.nm').textContent=x.name; if(x.winner)e.querySelector('.nm').insertAdjacentHTML('beforeend','<span class="won">WINNER</span>');
   e.querySelector('.pt').textContent=x.party==='dem'?'  (D)':x.party==='gop'?'  (R)':'';
   e.querySelector('.pct').textContent=x.pct+'%';e.querySelector('.pct').style.color=color(x.party);
   e.querySelector('.v').textContent=fmt(x.votes)+' votes';
   const i=e.querySelector('.bar i');i.style.width=x.pct+'%';i.style.background=color(x.party);box.appendChild(e)});
  if(c.length>2)document.getElementById('others').textContent='Others: '+c.slice(2).map(x=>x.last+' '+x.pct+'%').join(' · ');
  if(a.votes&&b){document.getElementById('others').textContent+=(c.length>2?'  —  ':'')+'Margin: '+fmt(Math.abs(a.votes-b.votes))+' votes'}
  if(j.counties)document.getElementById('cty').textContent=j.countiesReporting+' of '+j.counties+' counties reporting';
  document.getElementById('upd').textContent='Results checked '+ago(j.checked)+(j.sourceUpdated?' · source updated '+j.sourceUpdated:'');
  const key=c.map(x=>x.votes).join();if(lastKey&&key!==lastKey){const r=document.getElementById('res');r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash')}lastKey=key;
 }catch(e){document.getElementById('status').textContent='Couldn\'t load results — retrying'}
}
async function loadNews(){
 try{
  const j=await getJSON('news.json');const f=document.getElementById('feed');
  if(!j.items||!j.items.length){f.textContent='Waiting for headlines…';return}
  f.className='';f.innerHTML='';
  j.items.forEach(i=>{const e=document.createElement('div');e.className='item';const isNew=!first&&!seen.has(i.link);seen.add(i.link);
   e.innerHTML=(isNew?'<span class="new">NEW</span>':'')+'<a target="_blank" rel="noopener"></a><div class="mut"></div>';
   e.querySelector('a').textContent=i.title;e.querySelector('a').href=i.link;e.querySelector('.mut').textContent=ago(i.date);f.appendChild(e)});
  first=false;
 }catch(e){}
}
function tick(){loadResults();loadNews()}
tick();setInterval(tick,60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
</script>
</body></html>
