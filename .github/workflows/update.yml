name: Update news
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/**', '.github/workflows/**']
permissions:
  contents: write
concurrency:
  group: updater
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Update every minute for ~5.5 hours
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 330*60 ))
          i=0
          while [ $(date +%s) -lt $end ]; do
            python scripts/results.py || true
            if [ $((i % 3)) -eq 0 ]; then python scripts/update.py || true; fi
            git add news.json results.json
            if ! git diff --cached --quiet; then
              git commit -qm "Update results" && (git pull -q --rebase && git push -q || echo push-failed)
            fi
            i=$((i+1))
            sleep 60
          done
