name: Probe sources
on:
  push:
    paths: ['scripts/probe.py']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe.py
      - run: |
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add probe; git commit -m "probe" && git pull --rebase && git push
