<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Michigan Election Live</title>
<link rel="manifest" href="manifest.json?v=2">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#fff;--tx:#111;--mut:#5b6472;--soft:#f4f5f7;--track:#eceef1;--d:#1f5fd6;--r:#c62828;--live:#d22}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--tx:#eef0f3;--mut:#9aa3b0;--soft:#181b21;--track:#262a31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif;text-align:center}
.w{max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.top{padding:28px 20px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.live{border:2px solid var(--live);color:var(--live);border-radius:99px;padding:2px 12px;font-size:12px;font-weight:700}
h1{margin:0;font-size:26px}
h2{margin:0;font-size:22px}
.mut{color:var(--mut);font-size:13px}
.race{width:100%;margin-top:22px;display:flex;flex-direction:column;align-items:center}
.rhead{padding:0 20px 14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.h2h{width:100%;display:grid;grid-template-columns:1fr 1fr}
.side{color:#fff;padding:30px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.side .p{font-size:13px;font-weight:500;opacity:.9;letter-spacing:.5px}
.side .n{font-size:20px;font-weight:700}
.side .pct{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.side .v{font-size:13px}
.tag{margin-top:6px;background:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.mid{width:100%;padding:18px 20px 6px;display:flex;flex-direction:column;align-items:center;gap:8px}
.track{width:85%;height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--tx);border-radius:99px;transition:width .6s}
.trend{width:calc(100% - 32px);background:var(--soft);border-radius:16px;padding:16px 14px;margin-top:12px}
.lbl{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:1px;margin-bottom:10px}
.tr{display:grid;grid-template-columns:52px 1fr 1fr 64px;align-items:center;gap:6px;font-size:12px;padding:5px 0;font-variant-numeric:tabular-nums}
.tr .t{text-align:left;color:var(--mut)}
.tr .pin{text-align:right;color:var(--mut)}
.bl{display:flex;justify-content:flex-end}.br{display:flex;justify-content:flex-start}
.bl i,.br i{display:block;height:14px;border-radius:3px;min-width:2px}
.bl i{background:var(--d)}.br i{background:var(--r)}
.lead{font-size:11px;font-weight:700;margin-top:3px}
.axis{display:grid;grid-template-columns:52px 1fr 1fr 64px;gap:6px;font-size:11px;color:var(--mut);margin-bottom:4px}
.axis span:nth-child(2){text-align:right}.axis span:nth-child(3){text-align:left}.axis span:last-child{text-align:right}
.sep{width:60%;height:1px;background:var(--track);margin-top:26px}
.flash{animation:fl 1.5s}@keyframes fl{0%{filter:brightness(1.35)}100%{filter:none}}
</style></head><body>
<div class="w">
 <div class="top">
  <span class="live">● LIVE</span>
  <h1>Michigan Election Night</h1>
  <div class="mut" id="upd">Loading…</div>
 </div>
 <div id="races"></div>
 <div class="mut" style="margin:26px 0;font-size:11px">Results via NBC News · updates automatically</div>
</div>
<script>
const RACES=[
 {key:'senate',title:'US Senate'},
 {key:'governor',title:'Governor'},
 {key:'house10',title:'US House · District 10'}
];
const fmt=n=>Number(n||0).toLocaleString();
const p1=n=>Number(n||0).toFixed(1)+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function getJSON(f){return (await fetch(f+'?t='+Date.now(),{cache:'no-store'})).json()}
const box=document.getElementById('races');
RACES.forEach((r,i)=>{
 const el=document.createElement('section');el.className='race';el.id='r-'+r.key;
 el.innerHTML=(i?'<div class="sep" style="margin:0 0 26px"></div>':'')+
 '<div class="rhead"><h2>'+r.title+'</h2><div class="mut sub">Loading…</div></div>'+
 '<div class="h2h"><div class="side sd" style="background:var(--d)"><div class="p">DEMOCRAT</div><div class="n">—</div><div class="pct">—</div><div class="v"></div></div>'+
 '<div class="side sr" style="background:var(--r)"><div class="p">REPUBLICAN</div><div class="n">—</div><div class="pct">—</div><div class="v"></div></div></div>'+
 '<div class="mid"><div class="mg" style="font-size:15px;font-weight:700"></div><div class="track"><i style="width:0"></i></div><div class="mut cty"></div><div class="mut oth"></div></div>'+
 '<div class="trend"><div class="lbl">HALF-HOUR TREND · LEAD AT EACH :00 / :30</div><div class="rows mut">Collecting…</div></div>';
 box.appendChild(el);r.el=el;r.lastKey='';
});
function fill(el,c,lead,color){
 el.querySelector('.n').textContent=c.last;
 el.querySelector('.pct').textContent=p1(c.pct);
 el.querySelector('.v').textContent=fmt(c.votes);
 const old=el.querySelector('.tag');if(old)old.remove();
 const t=c.winner?'WINNER':(lead&&c.votes?'LEADING':'');
 if(t){const s=document.createElement('div');s.className='tag';s.textContent=t;s.style.color=color;el.appendChild(s)}
}
function halfHours(hist){
 if(!hist.length)return[];
 const pts=hist.map(h=>({...h,ts:new Date(h.t).getTime()}));
 const start=Math.ceil(pts[0].ts/1800000)*1800000, end=Date.now();
 const out=[];
 for(let b=start;b<=end;b+=1800000){
  let s=null;for(const p of pts){if(p.ts<=b)s=p;else break}
  if(s)out.push({b,...s});
 }
 const last=pts[pts.length-1];
 if(!out.length||out[out.length-1].ts!==last.ts)out.push({b:last.ts,...last,now:true});
 return out;
}
function renderTrend(r,hist,dName,rName){
 const rows=halfHours(hist),box=r.el.querySelector('.rows');
 if(!rows.length){box.textContent='Trend starts as votes come in.';return}
 const maxLead=Math.max(1,...rows.map(x=>Math.abs(x.d-x.r)));
 box.className='rows';
 let h='<div class="axis"><span></span><span>'+esc(dName)+' lead</span><span>'+esc(rName)+' lead</span><span>% in</span></div>';
 rows.forEach((x,i)=>{
  const lead=x.d-x.r,w=Math.round(Math.abs(lead)/maxLead*100);
  const prev=i?rows[i-1]:null,ch=prev?(lead-(prev.d-prev.r)):0;
  const tm=x.now?'Now':new Date(x.b).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const lbl=(lead>=0?dName:rName)+' +'+fmt(Math.abs(lead))+(prev?(' ('+(ch>=0?'▲ '+dName:'▲ '+rName)+' '+fmt(Math.abs(ch))+')'):'');
  h+='<div class="tr"><span class="t">'+tm+'</span>'+
   '<span class="bl">'+(lead>0?'<i style="width:'+w+'%"></i>':'')+'</span>'+
   '<span class="br">'+(lead<0?'<i style="width:'+w+'%"></i>':'')+'</span>'+
   '<span class="pin">'+esc(x.pin||'')+'</span></div>'+
   '<div class="lead" style="color:'+(lead>=0?'var(--d)':'var(--r)')+'">'+esc(lbl)+'</div>';
 });
 box.innerHTML=h;
}
async function loadRace(r){
 try{
  const [j,hist]=await Promise.all([getJSON('results-'+r.key+'.json'),getJSON('history-'+r.key+'.json').catch(()=>[])]);
  const c=j.candidates||[];if(c.length<2)return null;
  const d=c.find(x=>x.party==='dem')||c[0], g=c.find(x=>x.party==='gop')||c[1];
  const win=c.find(x=>x.winner);const el=r.el;
  fill(el.querySelector('.sd'),d,d.votes>=g.votes,'var(--d)');
  fill(el.querySelector('.sr'),g,g.votes>d.votes,'var(--r)');
  const lead=d.votes>=g.votes?d:g;
  el.querySelector('.sub').textContent=(j.percentIn||'0%')+' in · '+(win?win.last+' wins (projected)':'not called');
  el.querySelector('.mg').textContent=d.votes||g.votes?'Margin: '+fmt(Math.abs(d.votes-g.votes))+' votes ('+lead.last+')':'No votes reported yet';
  el.querySelector('.track i').style.width=parseFloat(j.percentIn||0)+'%';
  el.querySelector('.cty').textContent=j.counties>1?j.countiesReporting+' of '+j.counties+' counties reporting':'';
  const rest=c.filter(x=>x!==d&&x!==g);
  el.querySelector('.oth').textContent=rest.length?'Others: '+rest.map(x=>x.last+' '+p1(x.pct)).join(' · '):'';
  renderTrend(r,hist,d.last,g.last);
  const key=c.map(x=>x.votes).join();if(r.lastKey&&key!==r.lastKey){const h=el.querySelector('.h2h');h.classList.remove('flash');void h.offsetWidth;h.classList.add('flash')}r.lastKey=key;
  return j;
 }catch(e){r.el.querySelector('.sub').textContent='Couldn\'t load — retrying';return null}
}
async function tick(){
 const res=await Promise.all(RACES.map(loadRace));
 const s=res.find(Boolean);
 if(s)document.getElementById('upd').textContent='NBC updated '+(s.sourceUpdated||'')+' · checked '+new Date(s.checked).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
}
tick();setInterval(tick,60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
</script>
</body></html>
